name: Teacher voice

# Manual workflow.
#   vieneu (default): the open-source VieNeu-TTS model runs on the GitHub runner. No key, no quota.
#   fpt / zalo: web APIs, need a repository secret (Settings -> Secrets and variables -> Actions):
#   FPT_API_KEY  (FPT.AI, voices lannhi / linhsan = Southern female)   or   ZALO_API_KEY  (Zalo, voice 1 = South female)
# Step 1: run with mode "samples", download the artifact "voice-samples", listen, pick a voice.
# Step 2: run with mode "all" and the chosen voice: it commits public/audio/*.mp3 and redeploys.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: TTS provider
        type: choice
        options: [vieneu, fpt, zalo]
        default: vieneu
      voice:
        description: 'Voice (vieneu: south-female = the 4 Southern women for samples, or one name: Thục Đoan, Mỹ Duyên, Kim Thanh, Thùy Dung; fpt: lannhi or linhsan; zalo: 1)'
        type: string
        default: south-female
      mode:
        description: samples = a few clips to listen to; all = generate every clip and publish
        type: choice
        options: [samples, all]
        default: samples
      force:
        description: Regenerate clips that already exist (mode all)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  voice:
    runs-on: ubuntu-latest
    env:
      FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
      ZALO_API_KEY: ${{ secrets.ZALO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        if: inputs.provider == 'vieneu'
        with:
          python-version: '3.12'
      - name: Install VieNeu-TTS and ffmpeg
        if: inputs.provider == 'vieneu'
        run: |
          pip install vieneu soundfile numpy
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Samples
        if: inputs.mode == 'samples'
        run: npm run audio:gen -- --samples --provider "${{ inputs.provider }}" --voices "${{ inputs.voice }}" --out voice-samples
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'samples'
        with:
          name: voice-samples
          path: voice-samples

      - name: Generate all clips
        if: inputs.mode == 'all'
        # stop after 40 min and still save what was made (the next step runs anyway)
        timeout-minutes: 40
        continue-on-error: true
        run: |
          FORCE=""; if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          npm run audio:gen -- --provider "${{ inputs.provider }}" --voice "${{ inputs.voice }}" $FORCE
      - name: Commit clips and redeploy
        # also after a partial run (rate limit): keep the clips that worked, run again later for the rest
        if: ${{ !cancelled() && inputs.mode == 'all' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Add teacher voice clips (${{ inputs.provider }}/${{ inputs.voice }})"
          git push
          # pushes made with the workflow token do not trigger other workflows, so start them explicitly
          gh workflow run pages.yml
          gh workflow run docker.yml
