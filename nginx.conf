server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # The service worker and the HTML shell must never be cached, or updates never reach the phone.
  location = /sw.js            { add_header Cache-Control "no-cache"; }
  location = /index.html       { add_header Cache-Control "no-cache"; }
  location = /registerSW.js    { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { } default_type application/manifest+json; }
  location ~ ^/workbox-.*\.js$ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Hashed build files can be cached forever.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Audio clips: long cache (file names are content keys; regenerate => rename or bust via a new build).
  location /audio/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }

  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
